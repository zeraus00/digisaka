<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Toka AI – Sign In</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Roboto', Helvetica, Arial, sans-serif;
      background: #F3F4F6;
      display: flex;
      min-height: 100vh;
      min-height: 100dvh;
    }

    /* LEFT PANEL */
    .left-panel {
      position: relative;
      width: 39.31%;
      min-height: 100vh;
      min-height: 100dvh;
      background-image:
        linear-gradient(
          180deg,
          rgba(227, 255, 241, 0.72) 0%,
          rgba(27, 151, 90, 0.72) 33%,
          rgba(5, 96, 52, 0.72) 66%,
          rgba(18, 63, 41, 0.72) 100%
        ),
        url("blacksigatoka.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      overflow: hidden;
    }

    .logo-container {
      position: absolute;
      left: 34px;
      top: 22px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-box {
      width: 38px;
      height: 47px;
      border: 1px solid #007A48;
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .logo-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .brand-text {
      font-family: 'Roboto', sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: #006D43;
      line-height: 1;
      white-space: nowrap;
    }

    .promo-content {
      position: absolute;
      left: 47px;
      top: 698px;
      width: 450px;
    }

    .promo-heading {
      font-family: 'Roboto', sans-serif;
      font-size: 36px;
      font-weight: 700;
      line-height: 36px;
      color: #8CFF91;
      margin-bottom: 0;
    }

    .promo-description {
      position: absolute;
      left: 47px;
      top: 792px;
      width: 370px;
      font-family: 'Roboto', sans-serif;
      font-size: 20px;
      font-weight: 400;
      line-height: 24px;
      color: #F2F2F2;
      margin: 0;
    }

    .footer-text {
      position: absolute;
      left: 41px;
      bottom: 21px;
      font-family: 'Roboto', sans-serif;
      font-size: 16px;
      font-weight: 400;
      color: #9AA5A4;
    }

    /* RIGHT PANEL */
    .right-panel {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      min-height: 100vh;
      min-height: 100dvh;
    }

    .login-card {
      width: 100%;
      max-width: 483px;
      background: #FFFFFF;
      border: 1px solid #9CA3AF;
      border-radius: 12px;
      padding: 48px 72px;
      box-sizing: border-box;
    }

    .login-heading {
      font-family: 'Roboto', sans-serif;
      font-size: 36px;
      font-weight: 700;
      line-height: 43px;
      color: #1C1C1C;
      margin-bottom: 6px;
    }

    .login-subtitle {
      font-family: 'Roboto', sans-serif;
      font-size: 18px;
      font-weight: 400;
      color: #98A2B3;
      margin-bottom: 36px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-label {
      display: block;
      font-family: 'Roboto', sans-serif;
      font-size: 16px;
      font-weight: 400;
      color: #667085;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
      width: 100%;
    }

    .form-input {
      width: 100%;
      height: 45px;
      padding: 0 20px;
      border: 1px solid #1F2937;
      border-radius: 11px;
      background: #FFFFFF;
      font-family: 'Roboto', sans-serif;
      font-size: 14px;
      color: #1C1C1C;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .form-input:focus {
      border-color: #006F47;
    }

    .form-input::placeholder {
      color: #98A2B3;
    }

    .password-input {
      padding-right: 52px;
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .toggle-password svg {
      width: 20px;
      height: 20px;
      stroke: #666666;
      fill: none;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 24px 0 32px 0;
    }

    .remember-me input[type="checkbox"] {
      width: 15px;
      height: 15px;
      border: 1px solid #111111;
      border-radius: 2px;
      appearance: none;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
    }

    .remember-me input[type="checkbox"]:checked {
      background: #006F47;
      border-color: #006F47;
    }

    .remember-me input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      left: 4px;
      top: 1px;
      width: 4px;
      height: 8px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .remember-me label {
      font-family: 'Roboto', sans-serif;
      font-size: 14px;
      font-weight: 400;
      color: #111111;
      cursor: pointer;
      user-select: none;
    }

    .signin-button {
      width: 100%;
      height: 52px;
      background: #006F47;
      border: none;
      border-radius: 10px;
      font-family: 'Roboto', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: #FFFFFF;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .signin-button:hover {
      background: #005A3A;
    }

    .signin-button:active {
      background: #004D30;
    }

    .signin-button:focus-visible {
      outline: 3px solid #006F47;
      outline-offset: 2px;
    }

    /* RESPONSIVE DESIGN */
    @media (max-width: 1439px) {
      .left-panel {
        width: 39.31%;
      }
      .login-card {
        padding: 40px 48px;
      }
    }

    @media (max-width: 1023px) {
      .left-panel {
        display: none;
      }
      .right-panel {
        padding: 32px 20px;
      }
      .login-card {
        max-width: 100%;
        padding: 32px 24px;
        border-radius: 16px;
      }
      .login-heading {
        font-size: 32px;
        line-height: 40px;
      }
      .login-subtitle {
        font-size: 16px;
      }
      .form-input {
        height: 48px;
        font-size: 16px;
      }
    }

    @media (max-width: 767px) {
      body {
        flex-direction: column;
      }
      .right-panel {
        width: 100%;
        padding: 24px 16px 40px;
        align-items: flex-start;
      }
      .login-card {
        width: 100%;
        max-width: none;
        padding: 24px 20px;
        border-radius: 16px;
      }
      .login-heading {
        font-size: 28px;
        line-height: 36px;
      }
      .login-subtitle {
        font-size: 16px;
        margin-bottom: 28px;
      }
      .form-label {
        font-size: 15px;
      }
      .form-input {
        height: 48px;
        font-size: 16px;
        padding: 0 16px;
      }
      .password-input {
        padding-right: 48px;
      }
      .remember-me {
        margin: 20px 0 28px 0;
      }
      .signin-button {
        height: 48px;
        font-size: 16px;
      }
      .promo-content,
      .promo-description,
      .footer-text {
        display: none;
      }
      .logo-container {
        position: static;
        margin: 0 auto 32px;
        left: auto;
        top: auto;
      }
    }

    @media (max-height: 800px) {
      .promo-content {
        top: auto;
        bottom: 220px;
      }
      .promo-description {
        top: auto;
        bottom: 110px;
      }
    }

    @media (max-height: 700px) {
      .promo-content,
      .promo-description {
        display: none;
      }
      .footer-text {
        bottom: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <!-- LEFT PANEL - Promotional Background -->
  <section class="left-panel" aria-hidden="true">
    <div class="logo-container">
      <div class="logo-box">
        <img src="bananaleaf1.png" alt="" aria-hidden="true">
      </div>
      <span class="brand-text">Toka AI</span>
    </div>

    <div class="promo-content">
      <h2 class="promo-heading">
        Catch Black Sigatoka<br>
        before it spreads
      </h2>
    </div>

    <p class="promo-description">
      Scan banana leaves, assess them in<br>
      bulk, and schedule treatment while it<br>
      still works.
    </p>

    <p class="footer-text">
      Leads Agricultural Products Corporation
    </p>
  </section>

  <!-- RIGHT PANEL - Login Form -->
  <section class="right-panel">
    <form class="login-card" id="loginForm" novalidate>
      <h1 class="login-heading">Sign In</h1>
      <p class="login-subtitle">Use your Toka AI account.</p>

      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <div class="input-wrapper">
          <input
            type="email"
            id="email"
            name="email"
            class="form-input"
            placeholder="Email or Mobile Number"
            autocomplete="email"
            required
            aria-describedby="email-hint"
          >
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="input-wrapper">
          <input
            type="password"
            id="password"
            name="password"
            class="form-input password-input"
            placeholder="Email Password"
            autocomplete="current-password"
            required
            aria-describedby="password-hint"
          >
          <button
            type="button"
            class="toggle-password"
            id="togglePassword"
            aria-label="Show password"
            aria-pressed="false"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12Z"/>
              <circle cx="12" cy="12" r="3.2"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="remember-me">
        <input type="checkbox" id="rememberMe" name="rememberMe" value="true">
        <label for="rememberMe">Remember me</label>
      </div>

      <button type="submit" class="signin-button">Sign In</button>
    </form>
  </section>

  <script>
    // Password visibility toggle
    (function() {
      const toggleBtn = document.getElementById('togglePassword');
      const passwordInput = document.getElementById('password');
      const toggleIcon = toggleBtn.querySelector('svg');

      if (toggleBtn && passwordInput) {
        toggleBtn.addEventListener('click', function() {
          const isPassword = passwordInput.type === 'password';
          passwordInput.type = isPassword ? 'text' : 'password';
          toggleBtn.setAttribute('aria-pressed', isPassword);
          toggleBtn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');

          // Update icon - eye open vs eye closed
          if (isPassword) {
            toggleIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
          } else {
            toggleIcon.innerHTML = '<path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3.2"/>';
          }
        });
      }

      // Form submission - preserve existing functionality
      const form = document.getElementById('loginForm');
      if (form) {
        form.addEventListener('submit', function(e) {
          e.preventDefault();
          // Existing authentication logic would go here
          // For now, just prevent default and allow existing handlers to work
          console.log('Sign in attempted', {
            email: document.getElementById('email').value,
            rememberMe: document.getElementById('rememberMe').checked
          });
        });
      }

      // Keyboard accessibility for checkbox
      const checkbox = document.getElementById('rememberMe');
      if (checkbox) {
        checkbox.addEventListener('keydown', function(e) {
          if (e.key === ' ' || e.key === 'Enter') {
            e.preventDefault();
            this.checked = !this.checked;
          }
        });
      }
    })();
  </script>
</body>
</html>
