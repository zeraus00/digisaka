<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Profile — Bogart AI</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Roboto,Arial,sans-serif;background:#e6e6e6;color:#111;display:flex;justify-content:center}
.app{width:100%;max-width:430px;min-height:100vh;background:#e6e6e6;display:flex;flex-direction:column;position:relative}
header{display:flex;align-items:center;justify-content:space-between;background:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px}
.logo{width:34px;height:34px;border-radius:8px;background:#11772a;display:flex;align-items:center;justify-content:center}
header h1{margin:0;font-size:18px;color:#0d5c20}
.bell{width:36px;height:36px;border-radius:50%;border:0;background:#d4d4d4;display:flex;align-items:center;justify-content:center}
main{flex:1;padding:24px 16px 110px}
.hero{border-radius:16px;padding:22px 16px;text-align:center;background:linear-gradient(135deg,#8fb996,#f3e8bf)}
.av{width:72px;height:72px;border-radius:50%;background:#1e7a3a;color:#fff;font-weight:700;font-size:24px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.hero b{display:block;font-size:19px;color:#1e6b32}
.hero span{display:block;margin-top:4px;font-size:13px;color:#333}
.label{margin:20px 0 8px;font-size:13px;color:#595959}
.row{display:flex;align-items:center;gap:14px;width:100%;background:#fff;border:1px solid #888;border-radius:12px;padding:12px 14px;margin-bottom:10px;font:inherit;font-size:15px;font-weight:700;color:#111;text-align:left;cursor:pointer}
.row .t{width:40px;height:40px;border-radius:10px;background:#e9e3c4;display:flex;align-items:center;justify-content:center;flex:none}
.row .v{margin-left:auto;font-weight:400;font-size:14px;color:#595959}
.row:focus-visible,nav a:focus-visible{outline:3px solid #f5b82e;outline-offset:2px}
nav{position:fixed;bottom:0;width:100%;max-width:430px;background:#11772a;display:flex;justify-content:space-around;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px))}
nav a{color:#fff;text-decoration:none;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 10px;border-radius:10px}
nav a.on{color:#f5b82e}
svg{display:block}
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="logo" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M4 20C4 9 10 4 20 4c0 10-5 16-14 16z"/></svg></span>
    <h1>My Profile</h1>
    <button class="bell" aria-label="Notifications"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 17h12l-2-3v-4a4 4 0 0 0-8 0v4zM10 20h4"/></svg></button>
  </header>

  <main>
    <section class="hero" aria-label="Profile">
      <div class="av" aria-hidden="true">JC</div>
      <b>Juan Dela Cruz</b>
      <span>Sitio Malabo Banana Farm · Balayan, Batangas</span>
    </section>

    <div class="label">Account</div>

    <button class="row"><span class="t"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2d5a2d" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-5 4-7 8-7s8 2 8 7"/></svg></span>User Information</button>

    <button class="row"><span class="t"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2d5a2d" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg></span>Language<span class="v">English &nbsp;&#8250;</span></button>

    <button class="row"><span class="t"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2d5a2d" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16h0"/></svg></span>About Toka AI</button>

    <button class="row"><span class="t"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2d5a2d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4H5v16h5M15 8l4 4-4 4M19 12H9"/></svg></span>Log out</button>
  </main>

  <nav aria-label="Main">
    <a href="#"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8v10H3z"/></svg>Home</a>
    <a href="#"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>History</a>
    <a href="#"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 8V3h5M16 3h5v5M21 16v5h-5M8 21H3v-5"/><text x="12" y="16" font-size="10" fill="currentColor" stroke="none" text-anchor="middle" font-weight="700">A</text></svg>Scan</a>
    <a href="#" class="on" aria-current="page"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-5 4-7 8-7s8 2 8 7"/></svg>Profile</a>
  </nav>
</div>
</body>
</html>
